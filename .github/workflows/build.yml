name: Build APK

# Every push (and a manual run) builds the app and publishes it as a GitHub release.
# The link to the newest APK never changes:
#   https://github.com/<OWNER>/<REPO>/releases/latest/download/firelite.apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Gradle is installed directly, so the build does not depend on the wrapper files.
      # Keep this version in sync with gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests and build the release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk firelite.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: firelite-apk
          path: firelite.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v7
        with:
          name: firelite-apk
          path: dist

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "build-${GITHUB_RUN_NUMBER}" dist/firelite.apk \
            --target "$GITHUB_SHA" \
            --title "FireLite build ${GITHUB_RUN_NUMBER}" \
            --notes "Sideload with Downloader: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/firelite.apk"
