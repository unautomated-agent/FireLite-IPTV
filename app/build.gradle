plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.firetvlite.iptv'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.firetvlite.iptv'
        minSdk 28            // Fire OS 7 (Android 9): Fire TV Stick 4K Max, 1. Generation
        targetSdk 35
        // GitHub zaehlt die Builds hoch -> jede neue APK darf die alte ueberschreiben.
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0.0'
    }

    // Eigener Schluessel NUR fuer diese App. Er liegt bewusst im Repo (kein Geheimnis):
    // so haben alle Builds dieselbe Signatur und Updates klappen per Downloader.
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'firelite'
            keyAlias 'firelite'
            keyPassword 'firelite'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Media3 markiert viele Klassen als @UnstableApi; das ist nur eine Lint-Warnung.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'

    testImplementation 'junit:junit:4.13.2'
}
