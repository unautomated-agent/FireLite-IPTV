pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    // Die Version des Android-Plugins steht hier, damit app/build.gradle sie nicht braucht.
    plugins {
        id 'com.android.application' version '8.9.1'
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "firelite"
include(":app")
